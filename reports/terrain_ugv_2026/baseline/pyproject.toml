[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "terrain-ugv-baseline"
version = "0.1.0"
description = "Transparent synthetic terrain-aware planning baseline for wheeled UGV research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "matplotlib>=3.7,<4", "PyYAML>=6,<7"]
[project.scripts]
terrain-ugv-baseline = "terrain_baseline.cli:main"
[tool.setuptools.packages.find]
include = ["terrain_baseline*"]
